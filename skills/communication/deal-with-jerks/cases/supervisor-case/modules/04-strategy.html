<section class="module" id="strategy">
  <h2>最优策略：灰岩 + 文档</h2>
  <div class="callout strong" style="margin-bottom: 1.5rem;">
    <strong>灰岩法（Grey Rock）</strong>
    <p>在必须互动时，做一颗无趣的石头——<strong>不给情绪反应、不解释、不辩护、不讨好</strong>。让他从你这里得不到控制感的反馈。</p>
  </div>
  <div class="grid two">
    <div class="card">
      <h3>现实动作</h3>
      <ul class="list">
        <li>停止买零食、咖啡等讨好行为</li>
        <li>停止过度尊称，用正常工作称呼</li>
        <li>被质问时不解释动机，只回应事实</li>
        <li>被骂时沉默或只说「好的」，不给情绪反应</li>
      </ul>
    </div>
    <div class="card">
      <h3>文档化</h3>
      <ul class="list">
        <li>所有微信/钉钉对话截图保存</li>
        <li>口头指令后补发邮件/消息确认</li>
        <li>记录时间、地点、在场人员、具体内容</li>
        <li>为可能的HR介入或离职谈判攒证据链</li>
      </ul>
    </div>
  </div>
</section>
