interface:
  display_name: "文字／录音转动态图解视频"
  short_description: "从主题、稿件或录音制作动态图解，按画面效果选择代码动画并与实际旁白对齐"
  default_prompt: "使用 $text-or-voice-to-video，根据我的主题、文字稿或已有录音制作不露脸讲解视频。只有主题时先写清楚口播稿；若我要求先看稿，等确认后再制作。按镜头效果选择代码动画工具，结合实际截图或录屏、统一插画与持续对象变化，必要时接入局部外部渲染或生成镜头；仅有文字时用豆包生成AI旁白，以实际音轨对齐字幕与事件，保留可编辑工程和MP4。完成语义与视觉质量检查、逐幕看图和导出验证，禁用通用机器人占位与演示卡片拼图，同时交付自媒体标题、话题标签和简介，默认平台小红书。"
