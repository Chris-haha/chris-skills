<section class="module" id="protect">
  <h2>现在最该保什么</h2>
  <div class="grid two">
    <div class="card">
      <h3>✅ 优先保护</h3>
      <ul class="list">
        <li><strong>精神状态</strong> — 你已经「太内耗」，这是紧急止损</li>
        <li><strong>证据</strong> — 为可能的离职谈判或HR介入做准备</li>
        <li><strong>退路</strong> — 开始看外部机会，不要把全部希望押在这一个人身上</li>
      </ul>
    </div>
    <div class="card">
      <h3>🚫 现在最忌讳</h3>
      <ul class="list">
        <li>继续自我贬低式讨好（买零食、过度尊称）</li>
        <li>试图「讲道理」让他改变</li>
        <li>内耗问自己「是不是我不够好」</li>
        <li>期待「证明自己值得被他认可」</li>
      </ul>
    </div>
  </div>
  <div class="callout danger" style="margin-top: 1.5rem;">
    <strong>关键判断</strong>
    <p>这不是能「沟通解决」的局面，对方的机制是<strong>系统性的</strong>。你的目标不是改变他，是保护自己、减少消耗、准备退出。</p>
  </div>
</section>
