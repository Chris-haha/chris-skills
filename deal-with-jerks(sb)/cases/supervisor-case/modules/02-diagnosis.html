<section class="module" id="diagnosis">
  <h2>诊断 / 定性</h2>
  <div class="grid two">
    <div class="card">
      <h3>人物类型</h3>
      <div class="kv">
        <span class="kv-label">主类型</span>
        <span class="kv-value">操控型控制者</span>
      </div>
      <div class="kv">
        <span class="kv-label">次类型</span>
        <span class="kv-value">情感虐待型 + 权力威胁型</span>
      </div>
      <div class="tags" style="margin-top: 1rem;">
        <span class="tag">先羞辱后施恩</span>
        <span class="tag">绝对服从要求</span>
        <span class="tag">权力威胁</span>
      </div>
    </div>
    <div class="card">
      <h3>权力与风险</h3>
      <div class="kv">
        <span class="kv-label">关系</span>
        <span class="kv-value">直属主管 vs 下属</span>
      </div>
      <div class="kv">
        <span class="kv-label">对方掌握</span>
        <span class="kv-value">评价权、资源分配（询盘）、成长机会、去留影响</span>
      </div>
      <div class="kv">
        <span class="kv-label">风险等级</span>
        <span class="kv-value" style="color: var(--color-danger); font-weight: 700;">⚠️ 高</span>
      </div>
    </div>
  </div>
  <div class="callout strong" style="margin-top: 1.5rem;">
    <strong>对方的核心机制</strong>
    <p>通过摧毁你的自尊和判断力，建立绝对服从。你买零食、叫尊称、自我贬低的讨好，反而在喂养他的控制欲。</p>
  </div>
</section>
