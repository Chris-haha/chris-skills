<section class="module" id="scripts">
  <h2>话术库 / 直接复制使用</h2>
  <div class="script-block">
    <div class="script-item">
      <strong>场景1：他又开始「先骂再教」</strong>
      <p style="margin: 0.75rem 0; padding: 1rem; background: var(--color-surface-strong); border-radius: var(--radius-sm); font-family: var(--font-body);">「好的，我记下来。」</p>
      <p style="color: var(--color-text-muted); font-size: var(--text-sm);">💡 <strong>灰岩心法</strong>：不解释、不道歉、不对抗、不接情绪。说完就沉默，等他进入「教」的环节。</p>
    </div>
    <div class="script-item">
      <strong>场景2：他问「为什么用疑问句」</strong>
      <p style="margin: 0.75rem 0; padding: 1rem; background: var(--color-surface-strong); border-radius: var(--radius-sm); font-family: var(--font-body);">「我只是想确认理解对了，没有别的意思。您继续讲。」</p>
      <p style="color: var(--color-text-muted); font-size: var(--text-sm);">💡 <strong>翻译</strong>：我不接你的羞辱框架，我把话题拉回工作本身。</p>
    </div>
    <div class="script-item">
      <strong>场景3：他说「不听话就不给你询盘」</strong>
      <p style="margin: 0.75rem 0; padding: 1rem; background: var(--color-surface-strong); border-radius: var(--radius-sm); font-family: var(--font-body);">「我明白了。这部分我会再想想。」</p>
      <p style="color: var(--color-text-muted); font-size: var(--text-sm); margin-bottom: 0.5rem;">然后<strong>邮件/微信补一句</strong>：</p>
      <p style="margin: 0; padding: 1rem; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: var(--text-sm);">「刚才沟通的内容我整理一下：您建议我……我会在……之前完成。如有补充请随时告诉我。」</p>
      <p style="color: var(--color-text-muted); font-size: var(--text-sm); margin-top: 0.5rem;">💡 <strong>目的</strong>：把口头威胁变成书面记录。</p>
    </div>
  </div>
